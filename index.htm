<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        form {
            padding: 2%;
        }

        form tr {
            line-height: 1;
        }
    </style>
</head>
<body>
    <form action="/submit" method="POST">
        <table>
            <tr>
                <td><label for="uname">User Name:</label></td>
                <td><input type="text" class="input" name="uName" id="uName" placeholder="Enter Your Name" required>
                </td>
            </tr>
            <tr>
                <td><label for="umail">User Email:</label></td>
                <td><input type="email" class="input" name="uMail" id="uMail" placeholder="Enter Your Email" required>
                </td>
            </tr>
            <tr>
                <td><button type="submit" class="btn btn-primary">Submit</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
